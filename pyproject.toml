# Зависимости и настройки Ruff


[project]
name = "agregator"
version = "0.1.0"
description = "Агрегатор"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "sqlalchemy",
    "alembic",
    "greenlet",
    "pydantic[email]",
    "pydantic-settings",
    "httpx",
]



[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "alembic/versions",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
    "UP007",
    "F821",
    "E701",
    "B904",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.1.post1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.17.3",
]
